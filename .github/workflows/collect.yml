name: collect-monstarz

on:
  schedule:
    - cron: '5 2,10,18 * * *' # 매일 03:05, 11:05, 19:05 KST 수집/복구
  workflow_dispatch:
    inputs:
      mode:
        description: 'update(신규), backfill(특정 월), recover(8월 이후 복구)'
        type: choice
        options: [update, backfill, recover]
        default: update
      month:
        description: 'backfill 대상 월 (예: 2026-06)'
        default: ''
      start_id:
        description: 'backfill 시작 글번호 (해당 월 다음달 초 근처)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-monstarz
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test collector
        run: python -m unittest discover -s scraper -p 'test_*.py'

      - name: Collect
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            python scraper/scrape.py backfill \
              --month "${{ github.event.inputs.month }}" \
              --start-id "${{ github.event.inputs.start_id }}" \
              --delay 0.5 --max-minutes 300
          elif [ "${{ github.event.inputs.mode }}" = "recover" ] || python -c 'import json, pathlib, sys; p=pathlib.Path("data/recovery.json"); sys.exit(0 if p.exists() and not json.loads(p.read_text()).get("done") else 1)'; then
            python scraper/scrape.py recover --from-month 2026-08 --delay 0.5 --max-minutes 300
          else
            python scraper/scrape.py update --delay 0.5 --max-minutes 300
          fi

      - name: Build stats JSON
        if: always()
        run: python scraper/build_stats.py

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: update monstarz ranking [skip ci]"
          git push

      - name: Report collection status
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('data/recovery.json')
          if path.exists():
              recovery = json.loads(path.read_text())
              if recovery.get('done'):
                  message = '복구 완료: 8월 이후 전체 구간 수집 완료.'
              else:
                  month = recovery['month']
                  state_path = pathlib.Path(f'data/state_{month}.json')
                  state = json.loads(state_path.read_text()) if state_path.exists() else {}
                  message = f"복구 진행 중: {month}, {state.get('counters', {}).get('posts', 0):,}개 글 수집. 전체 복구 미완료. 마지막 확인 날짜: {state.get('last_date', '시작 전')}."
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          PY

      - name: Continue unfinished recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c 'import json, pathlib, sys; p=pathlib.Path("data/recovery.json"); sys.exit(0 if p.exists() and not json.loads(p.read_text()).get("done") else 1)'; then
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=recover
          fi
